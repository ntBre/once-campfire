services:
  campfire:
    build:
      context: .
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: local
    volumes:
      - campfire:/rails/storage
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/up" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  campfire:
    name: campfire
    external: true
